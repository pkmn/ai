# /etc/ssh/sshd_config.d/100-arena-hardening.conf
# Restrict sshd to loopback peers (note macOS launchd socket-activates *:22, so both AllowUsers
# host matching and PF inbound `! lo0` port 22 blocking enforce loopback-only SSH).
ListenAddress 127.0.0.1:22
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
ChallengeResponseAuthentication no
PubkeyAuthentication yes
AllowUsers pkmn@127.0.0.1 pkmn@::1
DenyUsers p1 p2 root
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
GatewayPorts no
PermitTunnel no
PermitUserRC no
