# /etc/ssh/sshd_config.d/100-arena-hardening.conf
# Bind sshd strictly to loopback so SSH is reachable only via the reverse tunnel on 127.0.0.1:22.
ListenAddress 127.0.0.1:22
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
ChallengeResponseAuthentication no
PubkeyAuthentication yes
AllowUsers pkmn
DenyUsers p1 p2 root
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
GatewayPorts no
PermitTunnel no
PermitUserRC no
