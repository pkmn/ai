# /etc/ssh/sshd_config.d/100-arena-hardening.conf
# Restrict sshd to loopback peers (note macOS launchd socket-activates *:22, so both AllowUsers
# host matching and PF inbound `! lo0` port 22 blocking enforce loopback-only SSH).
ListenAddress 127.0.0.1:22
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
ChallengeResponseAuthentication no
PubkeyAuthentication yes
AllowUsers pkmn@127.0.0.1 pkmn@::1
DenyUsers p1 p2 root
X11Forwarding no
AllowAgentForwarding no
# Allow loopback-only local TCP forwarding exclusively to macOS Screen Sharing (127.0.0.1:5900)
# for remote GUI System Settings / TCC / macOS update maintenance over `ProxyJump pkmn.ai`.
AllowTcpForwarding local
PermitOpen 127.0.0.1:5900
GatewayPorts no
PermitTunnel no
PermitUserRC no
