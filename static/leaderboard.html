<nav aria-label="Format">
  <ul>
    {{{formatNavItems}}}
  </ul>
</nav>

<nav class="subnav" aria-label="Version filter">
  <ul>
    <li>
      <input type="radio" name="versions" id="ver-active" value="active" checked>
      <label for="ver-active">Active</label>
    </li>
    —
    <li>
      <input type="radio" name="versions" id="ver-best" value="best">
      <label for="ver-best">Best</label>
    </li>
    —
    <li>
      <input type="radio" name="versions" id="ver-all" value="all">
      <label for="ver-all">All</label>
    </li>
  </ul>
</nav>

<section id="standings">
  {{{standingsPanes}}}
</section>

<section id="history"{{{historyInitialClass}}}>
  <h3><a href="#history" class="subtle">History</a></h3>
  {{{historyPanes}}}
</section>

<section id="matchups"{{{matchupsInitialClass}}}>
  <h3><a href="#matchups" class="subtle">Matchups</a></h3>
  {{{matchupsPanes}}}
</section>

<script>
  const setTheme = t => document.documentElement.setAttribute('data-theme', t);
  document.addEventListener('DOMContentLoaded', () => {
    const ladderRadios = document.querySelectorAll('input[name="ladder"]');
    const verRadios = document.querySelectorAll('input[name="versions"]');
    const panes = document.querySelectorAll('.ladder-pane');
    const rows = document.querySelectorAll('.standings-table tbody tr');
    const historySec = document.getElementById('history');
    const matchupsSec = document.getElementById('matchups');

    const applyLadder = slot => {
      ladderRadios.forEach(r => {
        if (r.value === slot) r.checked = true;
      });
      panes.forEach(p => {
        p.classList.toggle('hide', p.dataset.ladder !== slot);
      });
      if (historySec) {
        const hp = historySec.querySelector('.ladder-pane[data-ladder="' + slot + '"]');
        historySec.classList.toggle('hide', !hp || hp.dataset.empty === 'true');
      }
      if (matchupsSec) {
        const mp = matchupsSec.querySelector('.ladder-pane[data-ladder="' + slot + '"]');
        matchupsSec.classList.toggle('hide', !mp || mp.dataset.empty === 'true');
      }
    };

    const applyHash = () => {
      if (!location.hash) return;
      const h = decodeURIComponent(location.hash.slice(1)).toLowerCase();
      for (let i = 0; i < ladderRadios.length; i++) {
        if (ladderRadios[i].value === h) {
          applyLadder(h);
          return;
        }
      }
    };

    ladderRadios.forEach(r => r.addEventListener('change', () => {
      applyLadder(r.value);
      if (history.replaceState) {
        history.replaceState(null, '', '#' + r.value);
      }
    }));

    verRadios.forEach(r => r.addEventListener('change', () => {
      const mode = r.value;
      rows.forEach(row => {
        if (mode === 'all') {
          row.classList.remove('hide');
        } else if (mode === 'best') {
          row.classList.toggle('hide', !row.dataset.best);
        } else {
          row.classList.toggle('hide', !row.dataset.active);
        }
      });
    }));

    window.addEventListener('hashchange', applyHash);
    applyHash();
  });
</script>
