<nav aria-label="Format filter">
  <ul>
    <li>
      <input type="radio" name="bformat" id="bf-all" value="all" checked>
      <label for="bf-all">All</label>
    </li>
    {{{formatFilterItems}}}
  </ul>
</nav>

<section id="live">
  <h3><a href="#live" class="subtle">Live</a></h3>
  <div class="live-panel" id="live-panel">
    {{{livePanelInner}}}
  </div>
</section>

<section id="history">
  <h3><a href="#history" class="subtle">History</a></h3>
  <div class="table-wrap">
    <table id="battles-table">
      <thead>
        <tr>
          <th>Battle</th>
          <th>Player 1</th>
          <th>Player 2</th>
          <th class="center" title="2-game blind-pair outcome (Game 1 / Game 2)">Result</th>
          <th class="num" title="Turns in Game 1 / Game 2">Turns</th>
          <th class="num">Completed</th>
        </tr>
      </thead>
      <tbody id="battles-tbody">
        {{{historyRows}}}
      </tbody>
    </table>
  </div>
</section>

<script>
  const setTheme = t => document.documentElement.setAttribute('data-theme', t);
  document.addEventListener('DOMContentLoaded', () => {
    let state = {{{initialLiveJson}}};
    const botLinks = {{{botLinksJson}}};
    const formatTitles = {{{formatTitlesJson}}};
    const livePanel = document.getElementById('live-panel');
    const tbody = document.getElementById('battles-tbody');
    const radios = document.querySelectorAll('input[name="bformat"]');
    let currentFmt = 'all';

    const esc = s => String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');

    const relTime = (nowSec, ts) => {
      const diff = Math.max(0, nowSec - ts);
      if (diff < 60) return diff + 's ago';
      if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
      if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
      return Math.floor(diff / 86400) + 'd ago';
    };

    const renderBot = (bot, bold) => {
      const inner = bold ? '<strong>' + esc(bot.name) + '</strong>' : esc(bot.name);
      const href = botLinks[bot.slug];
      const link = href ? '<a href="' + esc(href) + '" class="subtle">' + inner + '</a>' : inner;
      return link + ' <code>' + esc(bot.version) + '</code>';
    };

    const renderSlot = (key, slotData, live, nowSec) => {
      const isRunning = live.active_slot === key;
      const otherKey = key === 'p1' ? 'p2' : 'p1';
      const elapsed = isRunning ? Math.max(0, nowSec - live.turn_started_at) : 0;
      const budget = isRunning ? Math.round(live.turn_budget_s) : Math.round(slotData.bank_s);
      const bank = isRunning
        ? Math.max(0, Math.round(slotData.bank_s - elapsed))
        : Math.round(slotData.bank_s);
      const inc = Math.round(live.increment_s);
      const ramPct = ((slotData.ram_mb / 14336) * 100).toFixed(1);
      const badge = isRunning
        ? '<span class="state-running" id="state-' + key +
          '" title="Currently executing (SIGCONT)">&#9679; RUNNING</span>'
        : '<span class="state-paused" id="state-' + key +
          '" title="Frozen by kernel SIGSTOP while ' + otherKey + ' computes">PAUSED</span>';
      const timerTitle = 'Pokémon Showdown RoomBattleTimer: 150s max bank (+60s Turn 1 grace), +' +
        inc + 's/turn';
      return '<div class="slot-card ' + (isRunning ? 'running' : 'paused') + '" id="slot-' + key + '">' +
        '<div class="slot-top"><span><tt>' + key + '</tt> ' + renderBot(slotData, true) + '</span>' +
        badge + '</div>' +
        '<div class="slot-timers" title="' + esc(timerTitle) + '">' +
        '<span>Turn: <strong id="turn-' + key + '" class="' + (isRunning ? 'yes' : 'muted') + '">' +
        elapsed + 's</strong> <span class="muted">/ ' + budget + 's</span></span>' +
        '<span>Bank: <strong id="bank-' + key + '">' + bank + 's</strong> ' +
        '<span class="muted">(+' + inc + 's/turn)</span></span></div>' +
        '<div class="slot-telemetry">' +
        '<span>Last: <tt>' + Math.round(slotData.last_turn_ms) + ' ms</tt></span>' +
        '<span>Mean: <tt>' + Math.round(slotData.mean_turn_ms) + ' ms/turn</tt></span>' +
        '<span title="XNU ri_phys_footprint (14 GiB limit)">RAM: <tt>' +
        Math.round(slotData.ram_mb).toLocaleString('en-US') + ' MiB</tt> (' + ramPct + '%)</span>' +
        '</div></div>';
    };

    const renderLive = nowSec => {
      if (!livePanel) return;
      if (!state || !state.live || state.stale) {
        livePanel.innerHTML = '<div class="live-idle muted">' +
          (state && state.stale
            ? 'No active heartbeat — Arena is offline or idle.'
            : 'No battle currently running — Arena is idle.') +
          '</div>';
        return;
      }
      const l = state.live;
      const fmtTitle = formatTitles[l.format_id] || l.format_id;
      let g1Html = '';
      if (l.g1_summary) {
        const g1Res = l.g1_summary.winner_slot === 'p1'
          ? esc(l.p1.name) + ' 1–0'
          : l.g1_summary.winner_slot === 'p2'
            ? esc(l.p2.name) + ' 1–0'
            : 'Tie';
        g1Html = ' <span class="muted">(<tt>G1</tt>: ' + g1Res + ', ' +
          l.g1_summary.turns + ' turns)</span>';
      }
      const hbAge = Math.max(0, nowSec - state.updated_at);
      livePanel.innerHTML = '<div class="live-header"><span><code>' + esc(l.match_id) +
        '</code> · <tt>' + esc(fmtTitle) + '</tt> · <strong>Game ' + l.game_num +
        ' / 2</strong>, Turn ' + l.turn + g1Html + '</span>' +
        '<span class="muted">Heartbeat <tt>#' + l.heartbeat_seq + '</tt> (<tt id="hb-age">' +
        hbAge + 's</tt> ago)</span></div>' +
        '<div class="slots-grid">' +
        renderSlot('p1', l.p1, l, nowSec) +
        renderSlot('p2', l.p2, l, nowSec) +
        '</div>';
    };

    const resultParts = cat => {
      if (cat === 'WW') return {p1Win: true, p2Win: false, html: '<strong>2</strong>–0'};
      if (cat === 'WT' || cat === 'TW') {
        return {p1Win: true, p2Win: false, html: '<strong>1.5</strong>–0.5'};
      }
      if (cat === 'LL') return {p1Win: false, p2Win: true, html: '0–<strong>2</strong>'};
      if (cat === 'LT' || cat === 'TL') {
        return {p1Win: false, p2Win: true, html: '0.5–<strong>1.5</strong>'};
      }
      return {p1Win: false, p2Win: false, html: '1–1'};
    };

    const renderMatchRow = (m, nowSec) => {
      const r = resultParts(m.match_category);
      const b1 = Math.round(Math.min(m.v1_g1_bank_s, m.v1_g2_bank_s));
      const b2 = Math.round(Math.min(m.v2_g1_bank_s, m.v2_g2_bank_s));
      const tip = m.match_category + ' · ' + Math.round(m.v1_avg_turn_ms) + 'ms/' +
        Math.round(m.v2_avg_turn_ms) + 'ms · Bank ' + b1 + 's/' + b2 + 's · RAM ' +
        Math.round(m.v1_peak_ram_mb).toLocaleString('en-US') + 'M/' +
        Math.round(m.v2_peak_ram_mb).toLocaleString('en-US') + 'M';
      const tr = document.createElement('tr');
      tr.id = m.id;
      tr.dataset.fmt = m.slot;
      if (currentFmt !== 'all' && m.slot !== currentFmt) tr.classList.add('hide');
      tr.innerHTML = '<td><a href="#' + esc(m.id) + '" class="subtle"><code>' + esc(m.id) +
        '</code></a></td>' +
        '<td>' + renderBot(m.p1, r.p1Win) + '</td>' +
        '<td>' + renderBot(m.p2, r.p2Win) + '</td>' +
        '<td class="center" title="' + esc(tip) + '">' + r.html + '</td>' +
        '<td class="num">' + m.g1_turns + ' / ' + m.g2_turns + '</td>' +
        '<td class="num muted" data-ts="' + m.completed_at + '">' +
        relTime(nowSec, m.completed_at) + '</td>';
      return tr;
    };

    const applyFilter = fmt => {
      currentFmt = fmt;
      if (!tbody) return;
      const rows = tbody.querySelectorAll('tr[data-fmt]');
      rows.forEach(row => {
        row.classList.toggle('hide', fmt !== 'all' && row.dataset.fmt !== fmt);
      });
    };

    radios.forEach(r => r.addEventListener('change', () => applyFilter(r.value)));

    const checkHash = () => {
      if (!location.hash) return;
      const id = decodeURIComponent(location.hash.slice(1));
      const el = document.getElementById(id);
      if (el && el.tagName === 'TR') {
        el.classList.remove('hide');
        el.scrollIntoView();
      }
    };
    window.addEventListener('hashchange', checkHash);
    checkHash();

    setInterval(() => {
      const nowSec = Math.floor(Date.now() / 1000);
      const hbEl = document.getElementById('hb-age');
      if (hbEl && state) {
        hbEl.textContent = Math.max(0, nowSec - state.updated_at) + 's';
      }
      if (state && state.live && !state.stale && state.live.active_slot) {
        const key = state.live.active_slot;
        const slot = state.live[key];
        if (slot) {
          const dt = Math.max(0, nowSec - state.live.turn_started_at);
          const turnEl = document.getElementById('turn-' + key);
          const bankEl = document.getElementById('bank-' + key);
          if (turnEl) turnEl.textContent = dt + 's';
          if (bankEl) bankEl.textContent = Math.max(0, Math.round(slot.bank_s - dt)) + 's';
        }
      }
    }, 1000);

    const pollLive = async () => {
      try {
        const res = await fetch('/api/live.json', {
          cache: 'no-cache',
          headers: {Accept: 'application/json'},
        });
        if (!res.ok) return;
        const next = await res.json();
        const nowSec = Math.floor(Date.now() / 1000);
        const prevKey = state && state.live && !state.stale
          ? state.live.match_id + ':' + state.live.heartbeat_seq + ':' + state.stale
          : 'idle:' + Boolean(state && state.stale);
        const nextKey = next && next.live && !next.stale
          ? next.live.match_id + ':' + next.live.heartbeat_seq + ':' + next.stale
          : 'idle:' + Boolean(next && next.stale);
        state = next;
        if (prevKey !== nextKey) {
          renderLive(nowSec);
        }
        if (tbody && Array.isArray(next.recent_matches) && next.recent_matches.length > 0) {
          const emptyRow = tbody.querySelector('.empty-row');
          if (emptyRow) emptyRow.remove();
          for (let i = next.recent_matches.length - 1; i >= 0; i--) {
            const m = next.recent_matches[i];
            if (!document.getElementById(m.id)) {
              tbody.insertBefore(renderMatchRow(m, nowSec), tbody.firstChild);
            }
          }
        }
        if (tbody) {
          tbody.querySelectorAll('td[data-ts]').forEach(td => {
            const ts = Number(td.getAttribute('data-ts'));
            if (Number.isFinite(ts)) td.textContent = relTime(nowSec, ts);
          });
        }
      } catch {}
    };

    pollLive();
    setInterval(pollLive, 3000);
  });
</script>
