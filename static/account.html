<div class="account-bar" id="account">
  <span><span class="muted">Developer:</span> <a href="{{ghHref}}" class="subtle"><strong>{{ghLogin}}</strong></a></span>
  <span class="muted">·</span>
  <span><span class="muted">Discord:</span> {{{discordHtml}}}</span>
  <span class="muted">·</span>
  <span><span class="muted">Project:</span> <a href="{{projectHref}}" class="subtle"><strong>{{projectName}}</strong></a></span>
  <span class="muted">·</span>
  <span><span class="muted">Status:</span> <span class="{{statusClass}}" title="{{statusTitle}}">{{statusLabel}}</span></span>
</div>

{{{activeSection}}}

<section id="submission">
  <h3><a href="#submission" class="subtle">Submission</a></h3>
  <form id="submission-form" class="form-box{{formDisabledClass}}" method="POST" action="/api/submissions">
    <fieldset class="form-fieldset"{{{fieldsetDisabled}}}>
      <div class="form-grid">
        <label for="sub-ver">Version</label>
        <div class="form-row-inline">
          <input id="sub-ver" name="version" class="input-text input-short" type="text" maxlength="12" pattern="[A-Za-z0-9][A-Za-z0-9._\-]{0,11}" placeholder="e.g. 1.0.0" required>
          <label for="sub-type">Package</label>
          <select id="sub-type" name="package" class="min-select">
            <option value="bundle" selected>darwin/arm64 (.tar.zst)</option>
            <option value="oci">OCI image</option>
          </select>
        </div>

        <label for="sub-url">Artifact URL</label>
        <input id="sub-url" name="url" class="input-text" type="text" spellcheck="false" placeholder="https://.../agent-darwin-arm64.tar.zst or ghcr.io/org/agent:1.0.0" required>

        <label for="sub-sha">SHA-256</label>
        <input id="sub-sha" name="sha256" class="input-text" type="text" spellcheck="false" placeholder="64-character hex archive or OCI manifest digest" required>

        <label for="sub-auth">Auth Header</label>
        <input id="sub-auth" name="authToken" class="input-text" type="password" autocomplete="off" placeholder="Optional one-time header for private releases (scrubbed immediately after fetch)">

        {{{poolTeamsRowHtml}}}

        {{{tournamentsRowHtml}}}

        <label>Ladders</label>
        <div class="ladders-submit-row">
          <div class="check-group">
            {{{checkboxesHtml}}}
          </div>
          <button id="sub-btn" type="submit" class="btn"{{{submitDisabled}}}{{{submitTitleAttr}}}>Submit</button>
        </div>
      </div>
    </fieldset>
    {{{statusNotice}}}
  </form>
</section>

{{{historySection}}}

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const unlinkBtn = document.getElementById('discord-unlink-btn');
    if (unlinkBtn) {
      unlinkBtn.addEventListener('click', async e => {
        e.preventDefault();
        const res = await fetch('/api/account/discord/unlink', {
          method: 'POST',
          headers: {Accept: 'application/json'},
        });
        if (res.ok) window.location.reload();
      });
    }

    const urlInput = document.getElementById('sub-url');
    const typeSelect = document.getElementById('sub-type');
    const tourneyChecks = document.querySelectorAll('input[name="tournaments"]');
    const bundleOpt = typeSelect ? typeSelect.querySelector('option[value="bundle"]') : null;
    const syncTourneyPackage = () => {
      if (!typeSelect) return;
      let anyTourney = false;
      tourneyChecks.forEach(cb => {
        if (cb.checked) anyTourney = true;
      });
      if (bundleOpt) bundleOpt.disabled = anyTourney;
      if (anyTourney) typeSelect.value = 'oci';
    };
    tourneyChecks.forEach(cb => cb.addEventListener('change', syncTourneyPackage));
    syncTourneyPackage();

    if (urlInput && typeSelect) {
      urlInput.addEventListener('input', () => {
        const v = urlInput.value.trim().split('?')[0].toLowerCase();
        if (!v) return;
        const isArchive = /\.(tar\.gz|tgz|tar\.xz|txz|tar\.zst|tzst)$/.test(v);
        if (isArchive && (!bundleOpt || !bundleOpt.disabled)) {
          typeSelect.value = 'bundle';
        } else if (!v.startsWith('http://') && !v.startsWith('https://') && v.includes('/')) {
          typeSelect.value = 'oci';
        }
      });
    }

    const teamFields = document.querySelectorAll('.pool-teams-field');
    const ladderChecks = document.querySelectorAll('input[name="ladders"]');
    const progressText = document.getElementById('pool-progress-text');
    const validateTeamsBtn = document.getElementById('validate-teams-btn');
    const clearTeamsBtn = document.getElementById('clear-teams-btn');

    const getFeedbackEl = () => {
      let el = document.getElementById('teams-feedback');
      if (!el) {
        const panel = document.getElementById('pool-teams-panel');
        if (!panel) return null;
        el = document.createElement('div');
        el.id = 'teams-feedback';
        el.className = 'teams-feedback hide';
        panel.appendChild(el);
      }
      return el;
    };

    const getActivePoolCheckbox = () => {
      let found = null;
      ladderChecks.forEach(cb => {
        if (!found && cb.checked && cb.dataset.needsTeams === 'true') found = cb;
      });
      return found;
    };

    const renderPoolProgress = (saved, required) => {
      const remaining = Math.max(0, required - saved);
      const pct = required > 0 ? Math.min(100, Math.round((saved / required) * 100)) : 0;
      const activeCb = getActivePoolCheckbox();
      if (activeCb) {
        activeCb.dataset.savedTeams = String(saved);
        const labelEl = activeCb.closest('label');
        if (labelEl) {
          let hintEl = labelEl.querySelector('.pool-status-hint');
          if (!hintEl) {
            hintEl = document.createElement('span');
            hintEl.className = 'muted pool-status-hint';
            labelEl.appendChild(hintEl);
          }
          const parts = [];
          if (activeCb.dataset.upcoming === 'true') parts.push('upcoming');
          if (saved > 0 && required > 0) parts.push(saved + '/' + required + ' saved');
          hintEl.textContent = parts.length ? ' (' + parts.join(' · ') + ')' : '';
        }
      }
      if (progressText) {
        progressText.textContent = '';
        const strong = document.createElement('strong');
        strong.textContent = saved + ' / ' + required;
        progressText.appendChild(strong);
        progressText.appendChild(
          document.createTextNode(
            remaining === 0
              ? ' distinct teams saved — ready to submit'
              : ' distinct teams saved — ' + remaining + ' more needed'
          )
        );
      }
      let fillEl = document.getElementById('pool-progress-fill');
      if (!fillEl) {
        const track = document.querySelector('.progress-track');
        if (track) {
          fillEl = document.createElement('div');
          fillEl.id = 'pool-progress-fill';
          fillEl.className = 'progress-fill';
          track.appendChild(fillEl);
        }
      }
      if (fillEl) {
        fillEl.style.width = pct + '%';
        fillEl.classList.toggle('complete', remaining === 0 && required > 0);
      }
      if (clearTeamsBtn) {
        clearTeamsBtn.classList.toggle('hide', saved <= 0);
      }
    };

    const renderTeamsFeedback = (summary, rejections, isError) => {
      const box = getFeedbackEl();
      if (!box) return;
      box.classList.remove('hide');
      box.textContent = '';
      const summaryEl = document.createElement('div');
      summaryEl.id = 'teams-feedback-summary';
      summaryEl.className = isError ? 'no' : 'yes';
      summaryEl.textContent = summary;
      box.appendChild(summaryEl);
      if (Array.isArray(rejections) && rejections.length) {
        const listEl = document.createElement('ul');
        listEl.id = 'teams-rejections';
        listEl.className = 'teams-rejections';
        rejections.forEach(item => {
          const li = document.createElement('li');
          li.textContent = typeof item === 'string' ? item : item.reason;
          listEl.appendChild(li);
        });
        box.appendChild(listEl);
      }
    };

    const syncTeamsVisibility = () => {
      if (!teamFields.length) return;
      const activeCb = getActivePoolCheckbox();
      teamFields.forEach(el => el.classList.toggle('hide', !activeCb));
      if (activeCb) {
        renderPoolProgress(
          Number(activeCb.dataset.savedTeams || 0),
          Number(activeCb.dataset.requiredTeams || 0)
        );
      }
    };
    ladderChecks.forEach(cb => cb.addEventListener('change', syncTeamsVisibility));
    syncTeamsVisibility();

    const fileInput = document.getElementById('sub-teams-file');
    const teamsArea = document.getElementById('sub-teams');
    if (fileInput && teamsArea) {
      fileInput.addEventListener('change', () => {
        const f = fileInput.files && fileInput.files[0];
        if (!f) return;
        const reader = new FileReader();
        reader.onload = () => {
          teamsArea.value = String(reader.result || '');
        };
        reader.readAsText(f);
      });
    }

    if (validateTeamsBtn && teamsArea) {
      validateTeamsBtn.addEventListener('click', async () => {
        const activeCb = getActivePoolCheckbox();
        if (!activeCb) return;
        if (!teamsArea.value.trim()) {
          renderTeamsFeedback('Paste one or more Showdown teams first.', [], true);
          return;
        }
        validateTeamsBtn.disabled = true;
        try {
          const res = await fetch('/api/account/teams', {
            method: 'POST',
            headers: {'Content-Type': 'application/json', Accept: 'application/json'},
            body: JSON.stringify({ladderId: activeCb.value, teams: teamsArea.value}),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            renderTeamsFeedback(data.error || ('Validation failed (' + res.status + ')'), [], true);
            return;
          }
          renderPoolProgress(data.savedCount, data.requiredCount);
          const rej = Array.isArray(data.rejections) ? data.rejections : [];
          if (rej.length > 0) {
            renderTeamsFeedback(
              'Saved ' + data.savedCount + ' / ' + data.requiredCount + ' distinct teams (' +
                data.remainingCount + ' more needed) — ' + rej.length + ' team(s) rejected:',
              rej,
              true
            );
          } else if (data.complete) {
            teamsArea.value = '';
            renderTeamsFeedback(
              'All ' + data.requiredCount + ' / ' + data.requiredCount +
                ' distinct teams validated and saved — submit your build below.',
              [],
              false
            );
          } else {
            teamsArea.value = '';
            renderTeamsFeedback(
              'Saved +' + data.newlySavedCount + ' team(s): ' + data.savedCount + ' / ' +
                data.requiredCount + ' saved — ' + data.remainingCount + ' more needed.',
              [],
              false
            );
          }
        } catch {
          renderTeamsFeedback('Network error validating teams.', [], true);
        } finally {
          validateTeamsBtn.disabled = false;
        }
      });
    }

    if (clearTeamsBtn) {
      clearTeamsBtn.addEventListener('click', async () => {
        const activeCb = getActivePoolCheckbox();
        if (!activeCb) return;
        clearTeamsBtn.disabled = true;
        try {
          const res = await fetch('/api/account/teams/clear', {
            method: 'POST',
            headers: {'Content-Type': 'application/json', Accept: 'application/json'},
            body: JSON.stringify({ladderId: activeCb.value}),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            renderTeamsFeedback(data.error || 'Could not clear saved teams.', [], true);
            return;
          }
          renderPoolProgress(0, Number(data.requiredCount || activeCb.dataset.requiredTeams || 0));
          const box = document.getElementById('teams-feedback');
          if (box) box.classList.add('hide');
        } catch {
          renderTeamsFeedback('Network error clearing saved teams.', [], true);
        } finally {
          clearTeamsBtn.disabled = false;
        }
      });
    }

    const form = document.getElementById('submission-form');
    const getStatusEl = () => {
      let el = document.getElementById('sub-status');
      if (!el && form) {
        el = document.createElement('div');
        el.id = 'sub-status';
        el.className = 'hide';
        form.appendChild(el);
      }
      return el;
    };
    const submitBtn = document.getElementById('sub-btn');
    if (form && submitBtn) {
      form.addEventListener('submit', async e => {
        e.preventDefault();
        const statusEl = getStatusEl();
        if (!statusEl) return;
        const ladders = [];
        ladderChecks.forEach(cb => {
          if (cb.checked) ladders.push(cb.value);
        });
        const tournaments = [];
        tourneyChecks.forEach(cb => {
          if (cb.checked) tournaments.push(cb.value);
        });
        const payload = {
          version: document.getElementById('sub-ver').value.trim(),
          package: typeSelect.value,
          url: urlInput.value.trim(),
          sha256: document.getElementById('sub-sha').value.trim(),
          authToken: document.getElementById('sub-auth').value.trim(),
          ladders,
          tournaments,
        };
        if (teamsArea && !teamsArea.closest('.hide') && teamsArea.value.trim()) {
          payload.teams = teamsArea.value;
        }
        submitBtn.disabled = true;
        statusEl.className = 'muted';
        statusEl.textContent = 'Validating submission...';
        try {
          const res = await fetch('/api/submissions', {
            method: 'POST',
            headers: {'Content-Type': 'application/json', Accept: 'application/json'},
            body: JSON.stringify(payload),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            statusEl.className = 'no';
            statusEl.textContent = data.error || ('Submission failed (' + res.status + ')');
            if (typeof data.savedCount === 'number' && typeof data.requiredCount === 'number') {
              renderPoolProgress(data.savedCount, data.requiredCount);
              renderTeamsFeedback(
                data.savedCount + ' / ' + data.requiredCount + ' distinct teams saved — ' +
                  data.remainingCount + ' more needed.',
                data.rejections || [],
                true
              );
            }
            submitBtn.disabled = false;
            return;
          }
          window.location.reload();
        } catch {
          statusEl.className = 'no';
          statusEl.textContent = 'Network error submitting version.';
          submitBtn.disabled = false;
        }
      });
    }
  });
</script>
