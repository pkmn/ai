<section id="overview" class="arena-blurb">
  {{{blurbHtml}}}
</section>

<section id="ladders">
  <h3><a href="#ladders" class="subtle">Ladders</a></h3>
  <div class="table-wrap">
    <table class="standings-table">
      <thead>
        <tr>
          <th>Ladder</th>
          <th>Agent</th>
          <th class="num" title="MAP Davidson Elo ± 95% Confidence Interval">Elo</th>
          <th class="num" title="Expected win percentage against prior N(1500, 350^2)">GXE</th>
          <th class="num" title="2-game blind-pair Match Wins – Losses – Ties (1-1 splits)">W–L–T</th>
          <th class="center" title="Current consecutive outright match win/loss streak">Streak</th>
          <th class="num" title="Pairwise Likelihood of Superiority over #2">LOS</th>
        </tr>
      </thead>
      <tbody>{{{ladderSummaryRows}}}</tbody>
    </table>
  </div>
</section>
{{{pastSeasonsSectionHtml}}}
<section id="tournaments">
  <h3><a href="#tournaments" class="subtle">Tournaments</a></h3>
  {{{tournamentsSummaryHtml}}}
</section>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const pageSize = 25;
    document.querySelectorAll('.pager[data-table-pager]').forEach(pager => {
      const wrap = pager.previousElementSibling;
      const tbody = wrap ? wrap.querySelector('tbody') : undefined;
      if (!tbody) return;
      const rows = Array.from(tbody.querySelectorAll('tr'));
      const prevBtn = pager.querySelector('[data-pager-prev]');
      const nextBtn = pager.querySelector('[data-pager-next]');
      const infoEl = pager.querySelector('[data-pager-info]');
      const singular = pager.dataset.singular || 'row';
      const plural = pager.dataset.plural || 'rows';
      let page = 1;
      const apply = () => {
        const total = rows.length;
        const totalPages = Math.max(1, Math.ceil(total / pageSize));
        if (page > totalPages) page = totalPages;
        if (page < 1) page = 1;
        const start = (page - 1) * pageSize;
        rows.forEach((row, idx) => {
          row.classList.toggle('hide', idx < start || idx >= start + pageSize);
        });
        pager.classList.toggle('hide', totalPages <= 1);
        if (prevBtn) prevBtn.disabled = page <= 1;
        if (nextBtn) nextBtn.disabled = page >= totalPages;
        if (infoEl) {
          const word = total === 1 ? singular : plural;
          infoEl.textContent =
            'Page ' + page + ' of ' + totalPages +
            ' (' + total.toLocaleString('en-US') + ' ' + word + ')';
        }
      };
      if (prevBtn) {
        prevBtn.addEventListener('click', () => {
          if (page > 1) {
            page--;
            apply();
          }
        });
      }
      if (nextBtn) {
        nextBtn.addEventListener('click', () => {
          page++;
          apply();
        });
      }
    });
  });
</script>
