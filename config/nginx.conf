# ln -s /home/pkmn/ai/config/nginx.conf /etc/nginx/sites-available/pkmn.ai
# ln -s /etc/nginx/sites-{available,enabled}/pkmn.ai
#
# Hybrid static + dynamic SSR/SSE architecture:
# - Static Djot/YAML/BibTeX essays (`/`, `/background/`, `/concepts/*`, `/glossary/`, `/research/`,
#   `/rules/`, `/release/`), the Showdown replay viewer (`/arena/viewer/`), and immutable `.7z` /
#   `.log` battle archives are served directly from `/home/pkmn/ai/public` by nginx.
# - Database-backed Arena and Project views (`/arena*`, `/projects*`) and JSON feeds are rendered
#   dynamically by Node.js (`127.0.0.1:1234`) with stateless `Cache-Control: no-cache` + `ETag`
#   (`304`), while `/api/battles/stream` and `/api/tournaments/:id/stream` push live updates
#   over unbuffered Server-Sent Events (`EventSource`).

upstream pkmn_node {
	server 127.0.0.1:1234;
	keepalive 16;
}

map $request_method $wiki_write_key {
	default "";
	POST $binary_remote_addr;
}

limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=live:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=logs:10m rate=1r/s;
limit_req_zone $binary_remote_addr zone=interactions:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=wiki:10m rate=1r/s;
limit_req_zone $wiki_write_key zone=wiki_write:10m rate=12r/m;
limit_req_zone $binary_remote_addr zone=auth:10m rate=15r/m;
limit_req_zone $binary_remote_addr zone=account:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=submissions:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=arena:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=sse_conn:10m;

server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;

	ssl_certificate /etc/letsencrypt/live/pkmn.ai/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/pkmn.ai/privkey.pem;
	include /etc/letsencrypt/options-ssl-nginx.conf;
	ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
	ssl_buffer_size 4k;

	server_name pkmn.ai;

	gzip on;
	gzip_vary on;
	gzip_min_length 256;
	gzip_types text/plain text/css application/json application/javascript image/svg+xml;

	proxy_http_version 1.1;
	proxy_buffer_size 16k;
	proxy_buffers 16 16k;

	add_header Strict-Transport-Security "max-age=63072000" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "SAMEORIGIN" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;

	# Baseline rate limit inherited by all static/redirect locations unless overridden below.
	limit_req zone=general burst=50 nodelay;
	limit_req_status 429;

	rewrite ^/(?:why|motivation|problem)$ https://pkmn.ai/background redirect;
	rewrite ^/(?:battles?|games?|matches?)\.json$ https://pkmn.ai/arena/battles.json redirect;
	rewrite ^/arena/(?:battle|games?|matches?)\.json$ https://pkmn.ai/arena/battles.json redirect;
	rewrite ^/(?:battles?|games?|matches?)/?$ https://pkmn.ai/arena/battles/ redirect;
	rewrite ^/arena/(?:battle|games?|matches?)/?$ https://pkmn.ai/arena/battles/ redirect;
	rewrite ^/(?:wtf|terminology|(?:term|definition)s?)(?:/(.*))?$ https://pkmn.ai/glossary/$1 redirect;
	rewrite ^/(?:ladder|leaderboard|ranking|rating|tournament|tour)s?/?$ https://pkmn.ai/arena/ redirect;
	rewrite ^/arena/(?:ladder|leaderboard|ranking|rating|tournament|tour)s?/?$ https://pkmn.ai/arena/ redirect;
	rewrite ^/(?:papers|agents)$ https://pkmn.ai/projects redirect;
	rewrite ^/(?:literature|readings?)$ https://pkmn.ai/research redirect;
	rewrite ^/rr$ https://pkmn.ai/release redirect;

	rewrite ^/(?:discord|chat|cabal)/?$ https://pkmn.cc/dev redirect;
	rewrite ^/logs(?:/(.*))?$ https://pkmn.ai/chat/logs/$1 redirect;

	root /home/pkmn/ai/public;
	index index.html;

	error_page 400 /400.html;
	error_page 401 /401.html;
	error_page 403 /403.html;
	error_page 404 /404.html;
	error_page 500 /500.html;
	error_page 502 /502.html;
	error_page 503 /503.html;
	error_page 504 /504.html;

	location ~ ^/(400|401|403|404|500|502|503|504)\.html$ {
		internal;
	}

	location = /auth/discord/validate {
		internal;
		proxy_pass http://pkmn_node/auth/discord/validate;
		proxy_set_header Connection "";
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_pass_request_body off;
		proxy_set_header Content-Length "";
	}

	location @error401 {
		if ($http_authorization != "") {
			return 401;
		}
		return 302 https://pkmn.ai/auth/discord?return_to=$request_uri;
	}

	location = /discord/interactions {
		limit_req zone=interactions burst=20 nodelay;
		proxy_pass http://pkmn_node;
		proxy_set_header Connection "";
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	location = /chat/logs/token {
		limit_req zone=logs burst=10 nodelay;
		proxy_set_header Connection "";
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Host $host;
		proxy_pass http://pkmn_node;
	}

	location = /chat/logs {
		return 301 https://pkmn.ai/chat/logs/;
	}

	location ^~ /chat/logs/ {
		auth_request /auth/discord/validate;
		error_page 401 = @error401;
		error_page 403 /403.html;
		error_page 404 /404.html;
		error_page 500 /500.html;
		limit_req zone=logs burst=10 nodelay;
		alias /home/pkmn/ai/chat/logs/;
		autoindex on;
		default_type text/plain;
		charset utf-8;
		gzip on;
		gzip_types text/plain;
		add_header Strict-Transport-Security "max-age=63072000" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header X-Frame-Options "SAMEORIGIN" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
		add_header Cache-Control "private, no-cache" always;

		location ~ /\. {
			return 404;
		}
	}

	location ~ /\.(?!well-known/) {
		return 404;
	}

	include /home/pkmn/ai/private/*.conf;

	location / {
		try_files $uri $uri/ @anchor_redirects;
	}

	location @anchor_redirects {
		rewrite ^/(glossary|research)/([^#/]+)/?$ https://pkmn.ai/$1/#$2 redirect;
		return 404;
	}

	# Static Showdown replay viewer iframe (`public/arena/viewer/index.html`).
	location = /arena/viewer {
		return 301 https://pkmn.ai/arena/viewer/;
	}

	location ^~ /arena/viewer/ {
		add_header Strict-Transport-Security "max-age=63072000" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header X-Frame-Options "SAMEORIGIN" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
		add_header Content-Security-Policy "sandbox allow-scripts; default-src 'none'; script-src 'unsafe-inline' https://play.pokemonshowdown.com; style-src 'unsafe-inline' https://play.pokemonshowdown.com; img-src https://play.pokemonshowdown.com data:; media-src https://play.pokemonshowdown.com;" always;
		add_header Cache-Control "no-cache" always;
		try_files $uri $uri/ =404;
	}

	# Dynamic SSR Arena views (`/arena`, `/arena/battles`, `/arena/ladders/*`, `/arena/tournaments/*`)
	# and their `.json` feeds (`Cache-Control: no-cache` + `ETag` `304`), while `.log` and `.7z`
	# archives under `/arena/` match the static regex locations below and serve directly from disk.
	location = /arena {
		proxy_set_header Connection "";
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Host $host;
		proxy_pass http://pkmn_node;
	}

	location = /arena.json {
		proxy_set_header Connection "";
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Host $host;
		proxy_pass http://pkmn_node;
	}

	location = /arena/index.html {
		proxy_set_header Connection "";
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Host $host;
		proxy_pass http://pkmn_node/arena/;
	}

	location /arena/ {
		proxy_set_header Connection "";
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Host $host;
		proxy_pass http://pkmn_node;
	}

	# Dynamic SSR Projects directory (`/projects`), Arena agent profiles (`/projects/:slug` + `.json`),
	# agent logos (`/projects/:slug.<ext>`), and non-Arena `#id` anchor redirects (`^~` keeps
	# `/projects.bib` static while preventing the static image/html regexes from shadowing Polka).
	location = /projects {
		proxy_set_header Connection "";
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Host $host;
		proxy_pass http://pkmn_node;
	}

	location ^~ /projects/ {
		proxy_set_header Connection "";
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Host $host;
		proxy_pass http://pkmn_node;
	}

	# Live Arena snapshot (`Cache-Control: no-cache` + `ETag` `304`).
	location = /api/live.json {
		limit_req zone=live burst=20 nodelay;
		proxy_set_header Connection "";
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Host $host;
		proxy_pass http://pkmn_node;
	}

	# Unbuffered Server-Sent Events (`EventSource`) streams for `/arena/battles/` and
	# `/arena/tournaments/:id/`.
	location = /api/battles/stream {
		limit_req zone=live burst=10 nodelay;
		limit_conn sse_conn 8;
		limit_conn_status 429;
		proxy_http_version 1.1;
		proxy_set_header Connection "";
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Host $host;
		proxy_buffering off;
		proxy_cache off;
		gzip off;
		proxy_read_timeout 3600s;
		add_header Strict-Transport-Security "max-age=63072000" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header X-Frame-Options "SAMEORIGIN" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
		add_header X-Accel-Buffering "no" always;
		proxy_pass http://pkmn_node;
	}

	location ^~ /api/tournaments/ {
		limit_req zone=live burst=10 nodelay;
		limit_conn sse_conn 8;
		limit_conn_status 429;
		proxy_http_version 1.1;
		proxy_set_header Connection "";
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Host $host;
		proxy_buffering off;
		proxy_cache off;
		gzip off;
		proxy_read_timeout 3600s;
		add_header Strict-Transport-Security "max-age=63072000" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header X-Frame-Options "SAMEORIGIN" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
		add_header X-Accel-Buffering "no" always;
		proxy_pass http://pkmn_node;
	}

	# Paginated battle history API queried when navigating pages or filtering formats on /arena/battles.
	location = /api/battles.json {
		limit_req zone=live burst=20 nodelay;
		proxy_set_header Connection "";
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Host $host;
		proxy_pass http://pkmn_node;
	}

	location @node_log {
		limit_req zone=logs burst=20 nodelay;
		proxy_set_header Connection "";
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Host $host;
		proxy_pass http://pkmn_node;
	}

	location ~* \.log$ {
		error_page 418 = @node_log;
		if ($is_args != "") {
			return 418;
		}
		default_type text/plain;
		charset utf-8;
		expires 30d;
	}

	location ~* \.7z$ {
		expires 30d;
	}

	# Daily-overwritten `<ladder>-logs.tar` archives must revalidate rather than cache 30d.
	location ~* \.tar$ {
		expires -1;
	}

	location ~* \.bib$ {
		expires 1d;
	}

	location ~* ^/(?!arena/(?!viewer/)|projects/|wiki/|account(?:/|$)).*\.html$ {
		add_header Strict-Transport-Security "max-age=63072000" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header X-Frame-Options "SAMEORIGIN" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
		add_header Cache-Control "no-cache" always;
	}

	location ~* \.(jpg|jpeg|png|svg|gif|ico|pdf)$ {
		expires 7d;
	}

	location ~* \.(css|js)$ {
		expires 365d;
	}

	location ^~ /wiki {
		limit_req zone=wiki burst=20 nodelay;
		limit_req zone=wiki_write burst=5 nodelay;
		proxy_set_header Connection "";
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Host $host;
		proxy_pass http://pkmn_node;
	}

	location ^~ /auth/ {
		limit_req zone=auth burst=10 nodelay;
		proxy_set_header Connection "";
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Host $host;
		proxy_pass http://pkmn_node;
	}

	location ^~ /account {
		limit_req zone=account burst=10 nodelay;
		proxy_set_header Connection "";
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Host $host;
		proxy_pass http://pkmn_node;
	}

	location = /api/submissions {
		limit_req zone=submissions burst=3 nodelay;
		client_max_body_size 1m;
		proxy_set_header Connection "";
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Host $host;
		proxy_pass http://pkmn_node;
	}

	location ^~ /api/account/ {
		limit_req zone=account burst=10 nodelay;
		proxy_set_header Connection "";
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Host $host;
		proxy_pass http://pkmn_node;
	}

	# Arena worker RPC endpoints (authenticated via Bearer $ARENA_SECRET; loopback when SSH-tunneled).
	location ^~ /api/arena/ {
		limit_req zone=arena burst=20 nodelay;
		client_max_body_size 16m;
		proxy_set_header Connection "";
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Host $host;
		proxy_pass http://pkmn_node;

		# Nested inside `^~ /api/arena/` so Nginx evaluates this regex after prefix matching
		# (a sibling `^~` location halts regex matching and would cap archive uploads at 16m).
		location ~ ^/api/arena/ladders/[^/]+/archive$ {
			limit_req zone=arena burst=5 nodelay;
			client_max_body_size 512m;
			proxy_request_buffering off;
			proxy_set_header Connection "";
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $remote_addr;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_set_header Host $host;
			proxy_pass http://pkmn_node;
		}
	}
}

server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;

	ssl_certificate /etc/letsencrypt/live/pkmn.ai/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/pkmn.ai/privkey.pem;
	include /etc/letsencrypt/options-ssl-nginx.conf;
	ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

	server_name www.pkmn.ai;
	return 301 https://pkmn.ai$request_uri;
}

server {
	listen 80;
	listen [::]:80;

	server_name pkmn.ai *.pkmn.ai;
	return 301 https://pkmn.ai$request_uri;
}
