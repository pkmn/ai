# ln -s /home/pkmn/ai/config/nginx.conf /etc/nginx/sites-available/pkmn.ai
#
# Static-first architecture:
# - Public pages (/arena/*, /projects/*, etc.) and JSON feeds (/api/live.json, */index.json) are
#   atomically pre-rendered into /home/pkmn/ai/public and served directly by nginx + Cloudflare
#   with zero Node.js load for spectators.
# - Node.js (127.0.0.1:1234) only handles OAuth (/auth/*), authenticated account/wiki routes
#   (/account, /api/account/*, /api/submissions, /wiki), Discord webhooks (/discord/interactions),
#   and the Arena worker RPC endpoints (/api/arena/*).

map $request_method $wiki_write_key {
	default "";
	POST $binary_remote_addr;
}

limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=live:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=logs:10m rate=1r/s;
limit_req_zone $binary_remote_addr zone=interactions:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=wiki:10m rate=1r/s;
limit_req_zone $wiki_write_key zone=wiki_write:10m rate=12r/m;
limit_req_zone $binary_remote_addr zone=auth:10m rate=15r/m;
limit_req_zone $binary_remote_addr zone=account:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=submissions:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=arena:10m rate=5r/s;

server {
	listen 443 ssl;
	listen [::]:443 ssl;

	ssl_certificate /etc/letsencrypt/live/pkmn.ai/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/pkmn.ai/privkey.pem;
	include /etc/letsencrypt/options-ssl-nginx.conf;
	ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

	server_name pkmn.ai;

	# Baseline rate limit inherited by all static/redirect locations unless overridden below.
	limit_req zone=general burst=50 nodelay;
	limit_req_status 429;

	rewrite ^/(?:why|motivation|problem)$ https://pkmn.ai/background redirect;
	rewrite ^/(?:battles?|games?|matches?)\.json$ https://pkmn.ai/arena/battles.json redirect;
	rewrite ^/arena/(?:battle|games?|matches?)\.json$ https://pkmn.ai/arena/battles.json redirect;
	rewrite ^/(?:battles?|games?|matches?)/?$ https://pkmn.ai/arena/battles redirect;
	rewrite ^/arena/(?:battle|games?|matches?)/?$ https://pkmn.ai/arena/battles redirect;
	rewrite ^/(?:wtf|terminology|(?:term|definition)s?)(?:/(.*))?$ https://pkmn.ai/glossary/$1 redirect;
	rewrite ^/(?:ladder|leaderboard|ranking|rating|tournament|tour)s?/?$ https://pkmn.ai/arena redirect;
	rewrite ^/arena/(?:ladder|leaderboard|ranking|rating|tournament|tour)s?/?$ https://pkmn.ai/arena redirect;
	rewrite ^/(?:papers|agents)$ https://pkmn.ai/projects redirect;
	rewrite ^/(?:literature|readings?)$ https://pkmn.ai/research redirect;
	rewrite ^/rr$ https://pkmn.ai/release redirect;

	rewrite ^/(?:discord|chat|cabal)/?$ https://pkmn.cc/dev redirect;
	rewrite ^/logs(?:/(.*))?$ https://pkmn.ai/chat/logs/$1 redirect;

	root /home/pkmn/ai/public;
	index index.html;

	error_page 400 /400.html;
	error_page 401 /401.html;
	error_page 403 /403.html;
	error_page 404 /404.html;
	error_page 500 /500.html;
	error_page 502 /502.html;
	error_page 503 /503.html;
	error_page 504 /504.html;

	location ~ ^/(400|401|403|404|500|502|503|504)\.html$ {
		internal;
	}

	location = /auth/discord/validate {
		internal;
		proxy_pass http://127.0.0.1:1234/auth/discord/validate;
		proxy_set_header Host $http_host;
		proxy_pass_request_body off;
		proxy_set_header Content-Length "";
	}

	location @error401 {
		if ($http_authorization != "") {
			return 401;
		}
		return 302 https://pkmn.ai/auth/discord?return_to=$request_uri;
	}

	location = /discord/interactions {
		limit_req zone=interactions burst=20 nodelay;
		proxy_pass http://127.0.0.1:1234;
		proxy_set_header Host $http_host;
	}

	location = /chat/logs/token {
		auth_request /auth/discord/validate;
		error_page 401 = @error401;
		error_page 403 /403.html;
		limit_req zone=logs burst=10 nodelay;
		proxy_pass http://127.0.0.1:1234;
		proxy_set_header Host $http_host;
	}

	location ^~ /chat/logs {
		auth_request /auth/discord/validate;
		error_page 401 = @error401;
		error_page 404 /404.html;
		error_page 500 /500.html;
		limit_req zone=logs burst=10 nodelay;
		alias /home/pkmn/ai/chat/logs;
		autoindex on;
		default_type text/plain;
		charset utf-8;
		gzip on;
		gzip_types text/plain;
		add_header Cache-Control "private, no-cache" always;

		location ~ /\. {
			return 404;
		}
	}

	include /home/pkmn/ai/private/*.conf;

	location / {
		try_files $uri $uri/ @anchor_redirects;
	}

	location @anchor_redirects {
		rewrite ^/(glossary|projects|research)/([^#/]+)/?$ https://pkmn.ai/$1/#$2 redirect;
		return 404;
	}

	# Polled every 3s by /arena/battles and live tournament pages; no-cache forces ETag 304s.
	location = /api/live.json {
		limit_req zone=live burst=10 nodelay;
		add_header Cache-Control "no-cache" always;
		try_files $uri =404;
	}

	location = /api/tournament-live.json {
		limit_req zone=live burst=10 nodelay;
		add_header Cache-Control "no-cache" always;
		try_files $uri =404;
	}

	# Paginated battle history API queried when navigating pages or filtering formats on /arena/battles.
	location = /api/battles.json {
		limit_req zone=live burst=20 nodelay;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Host $host;
		proxy_pass http://127.0.0.1:1234;
	}

	location = /api/battles {
		limit_req zone=live burst=20 nodelay;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Host $host;
		proxy_pass http://127.0.0.1:1234;
	}

	# Machine-consumable JSON parity: `/<path>.json` resolves identically to `/<path>/index.json`.
	location ~ ^/(.+)\.json$ {
		default_type application/json;
		charset utf-8;
		add_header Cache-Control "no-cache" always;
		try_files $uri /$1/index.json =404;
	}

	location ~* \.log$ {
		default_type text/plain;
		charset utf-8;
		expires 30d;
	}

	location ~* \.7z$ {
		expires 30d;
	}

	location ~* \.(html|bib)$ {
		expires 1d;
	}

	location ~* \.(jpg|jpeg|png|svg|gif|ico|pdf)$ {
		expires 7d;
	}

	location ~* \.(css|js)$ {
		expires 365d;
	}

	location ^~ /wiki {
		limit_req zone=wiki burst=20 nodelay;
		limit_req zone=wiki_write burst=5 nodelay;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header Host $host;
		proxy_pass http://127.0.0.1:1234;
	}

	location ^~ /auth/ {
		limit_req zone=auth burst=10 nodelay;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Host $host;
		proxy_pass http://127.0.0.1:1234;
	}

	location ^~ /account {
		limit_req zone=account burst=10 nodelay;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Host $host;
		proxy_pass http://127.0.0.1:1234;
	}

	location = /api/submissions {
		limit_req zone=submissions burst=3 nodelay;
		client_max_body_size 1m;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Host $host;
		proxy_pass http://127.0.0.1:1234;
	}

	location ^~ /api/account/ {
		limit_req zone=account burst=10 nodelay;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Host $host;
		proxy_pass http://127.0.0.1:1234;
	}

	# Arena worker RPC endpoints (authenticated via Bearer $ARENA_SECRET; loopback when SSH-tunneled).
	location ^~ /api/arena/ {
		limit_req zone=arena burst=20 nodelay;
		client_max_body_size 512m;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Host $host;
		proxy_pass http://127.0.0.1:1234;
	}
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;

	ssl_certificate /etc/letsencrypt/live/pkmn.ai/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/pkmn.ai/privkey.pem;
	include /etc/letsencrypt/options-ssl-nginx.conf;
	ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

	server_name www.pkmn.ai;
	return 301 https://pkmn.ai$request_uri;
}

server {
	listen 80;
	listen [::]:80;

	server_name pkmn.ai *.pkmn.ai;
	return 301 https://pkmn.ai$request_uri;
}
